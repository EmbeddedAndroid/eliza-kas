# The speaker microphones as they are: PAL raw record graph, no Fluence
# echo cancellation or noise suppression (audioreach-pipewire-plugin
# "pal.stream.type" = "raw"). Used to measure the speakers on the
# microphones.
context.modules = [
{   name = libpipewire-module-pal
    args = {
        node.name = "pal_source_speaker_mic_raw"
        node.description = "pal source speaker mic raw"
        stream.props = {
            audio.position = [ MONO ]
        }
        media.class = "Audio/Source"
        pal.stream.type = "raw"
    }
}
]
