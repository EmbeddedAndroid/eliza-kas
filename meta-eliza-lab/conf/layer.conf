# Lab layer for the Eliza EVK images: build fingerprints, console
# diagnostics and test configuration. Not a BSP layer: the board support
# lives in meta-qcom.
BBPATH .= ":${LAYERDIR}"
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb ${LAYERDIR}/recipes-*/*/*.bbappend"
BBFILE_COLLECTIONS += "eliza-lab"
BBFILE_PATTERN_eliza-lab = "^${LAYERDIR}/"
BBFILE_PRIORITY_eliza-lab = "20"
LAYERDEPENDS_eliza-lab = "core qcom"
LAYERSERIES_COMPAT_eliza-lab = "blacksail"

BBFILES_DYNAMIC += " \
    meta-audioreach:${LAYERDIR}/dynamic-layers/meta-audioreach/recipes-*/*/*.bbappend \
"
